name: Tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            node:
              - '**'
              - '!.gitignore'
              - '!LICENSE'
              - '!README.md'

  check-attw:
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Check if types are wrong with attw
        run: npx -p @arethetypeswrong/cli attw --pack --profile esm-only .

  test-coverage:
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Run tests with coverage
        run: npm test
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/

  ci-gate:
    needs:
      - changes
      - check-attw
      - test-coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi

  fix-ci:
    needs: ci-gate
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.ci-gate.result == 'failure' &&
      github.run_attempt == 1 &&
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.PI_GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Capture failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" and .name != "ci-gate") | .id' |
            while read -r job_id; do
              gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs"
            done > "$RUNNER_TEMP/failed-ci.log"
      - name: Investigate and fix CI failure
        uses: shaftoe/pi-coding-agent-action@193431b0260194099a5e6c91e5b69b8e3c9d3fb1 # develop
        with:
          github_token: ${{ github.token }}
          provider: openrouter
          model: openai/gpt-5.6-sol
          token: ${{ secrets.PI_OPENROUTER_API_KEY }}
          thinking_level: high
          update_comment: true
          prompt: |
            Investigate failed CI run ${{ github.run_id }} for Renovate PR #${{ github.event.pull_request.number }}. Inspect the PR diff and confirm the dependency update caused the failure. Read `${{ runner.temp }}/failed-ci.log`. Do not call `get_workflow_run_logs`.

            Only make an obvious, minimal, mechanical change that preserves behavior, such as formatting, removing an obsolete suppression, correcting an import or annotation, or applying an unambiguous API signature change. Never change logic, test assertions, dependencies, lockfiles, configuration, generated files, schemas, migrations, workflows, or unrelated code.

            Reproduce the failure and run the relevant failed CI command after editing. If it does not pass or cannot run reliably, restore your changes and do not push.

            If the validated fix meets every condition, call update_pull_request once with commit message "Fix CI after dependency update". Otherwise, leave the working tree unchanged and concisely report the failed job, likely cause, reason automation was unsafe, and suggested manual action.
